name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Mostrar erro
        if: failure()
        run: |
          {
            echo "## ❌ Erro na compilação"
            echo '```'
            grep -E "^e: " build.log | head -30 || true
            sed -n '/What went wrong/,/Try:/p' build.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: MeuIPTV-apk
          path: app/build/outputs/apk/debug/*.apk
